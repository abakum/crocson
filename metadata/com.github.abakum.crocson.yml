Builds:
  - versionName: 1.11.59
    versionCode: 1937
    commit: 65697efb055053e0caa8b3edeb7b1288ce9b965c
    output: crocson.apk
    forcevercode: true
    prebuild:
      - sed -i 's/^Build = .*/Build = 1937/' FyneApp.toml
      - sed -i 's/android:versionCode="[0-9]*"/android:versionCode="1937"/' AndroidManifest.xml
      - sed -i 's/android:versionName="[^"]*"/android:versionName="1.11.59"/' AndroidManifest.xml
    build:
      - export GOPATH=$HOME/go
      - export PATH=$GOPATH/bin:$PATH
      - test -d $GOPATH/tools || git clone https://github.com/abakum/tools.git $GOPATH/tools
      - cd $GOPATH/tools/cmd/fyne
      - go install
      - cd $HOME/build/com.github.abakum.crocson
      - fyne package -os android/arm64 --release
      - zip -d crocson.apk "META-INF/*" || true
    ndk: r26d

