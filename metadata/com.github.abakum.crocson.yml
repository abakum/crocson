Builds:
  - versionName: 1.11.60
    versionCode: 1938
    commit: e72691948517e1162f575856df031d0309f8355e
    sudo: apt-get install -y golang-go
    output: crocson-arm.apk
    prebuild: sed -i 's/^Build = .*/Build = $$VERCODE$$/' FyneApp.toml
    build:
      - export GOPATH=$HOME/go
      - export PATH=$GOPATH/bin:$PATH
      - git clone https://github.com/abakum/tools /tmp/tools
      - cd /tmp/tools/cmd/fyne
      - git checkout 52d93069c3628533ac10768a335b1f71d9075c9c
      - go install .
      - cd -
      - rm -rf /tmp/tools
      - fyne package -os android/arm --release
      - mv crocson.apk crocson-arm.apk
    ndk: r27d

