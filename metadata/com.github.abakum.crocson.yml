AutoName: crocson

RepoType: git
Repo: https://github.com/abakum/crocson

Builds:
  - versionName: 1.11.59
    versionCode: 1937
    commit: 65697efb055053e0caa8b3edeb7b1288ce9b965c
    sudo: apt-get update && apt-get install -y golang-go
    output: crocson.apk
    prebuild:
      - sed -i 's/^Build = .*/Build = $$VERCODE$$/' FyneApp.toml
      - sed -i 's/android:versionCode="[0-9]*"/android:versionCode="$$VERCODE$$"/' AndroidManifest.xml
      - sed -i 's/android:versionName="[^"]*"/android:versionName="$$VERSION$$"/' AndroidManifest.xml
    build:
      - export GOPATH=$HOME/go
      - export PATH=$GOPATH/bin:$PATH
      - test -d $GOPATH/tools || git clone https://github.com/abakum/tools.git $GOPATH/tools
      - cd $GOPATH/tools/cmd/fyne
      - go install
      - cd $HOME/build/com.github.abakum.crocson
      - fyne package -os android/arm64 --release
      - zip -d crocson.apk "META-INF/*" || true
    ndk: r26d

AutoUpdateMode: None
UpdateCheckMode: Static
