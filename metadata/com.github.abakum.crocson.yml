Builds:
  - versionName: 1.11.61
    versionCode: 1939
    commit: 6f083a84959aa4c06fe36850f764dc3e586e257e
    sudo:
      - apt-get update
      - apt-get install -y golang-go
    output: crocson.apk
    binary: https://github.com/abakum/crocson/releases/download/v%v/crocson-arm.apk
    srclibs:
      - go@go1.25.0
      - abakum-fyne-tools@dc72a0f9613222e4d5e5045046d9b5be93aa57f3
    prebuild: sed -i 's/^Build = .*/Build = $$VERCODE$$/' FyneApp.toml
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH=$HOME/go
      - export PATH=$GOROOT/bin:$GOPATH/bin:$PATH
      - go version
      - pushd $$abakum-fyne-tools$$/cmd/fyne
      - go install .
      - popd
      - sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - fyne package -os android/arm --release
    ndk: r27d

