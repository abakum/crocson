Builds:
  - versionName: 1.11.60
    versionCode: 1938
    commit: 16758c7cb13d0ab17d70b9b32108c57417fbbdef
    sudo:
      - apt-get update
      - apt-get install -y golang-go
    output: crocson.apk
    binary: https://github.com/abakum/crocson/releases/download/v%v/crocson-arm.apk
    srclibs:
      - go@go1.25.0
      - abakum-fyne-tools@9381ef18667a2178b0dd975a7ce2b80c026431e6
    prebuild: sed -i 's/^Build = .*/Build = $$VERCODE$$/' FyneApp.toml
    build:
      - pushd $$go$$/src
      - ./make.bash
      - popd
      - export GOROOT=$$go$$
      - export GOPATH=$HOME/go
      - export PATH=$GOROOT/bin:$GOPATH/bin:$PATH
      - go version
      - pushd $$abakum-fyne-tools$$/cmd/fyne
      - go install .
      - popd
      - fyne package -os android/arm --release
    ndk: r27d

