name: PEPK Export

on:
  workflow_dispatch:

jobs:
  pepk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > /tmp/keystore.jks

      - name: Fetch pepk.jar
        run: |
          git init /tmp/tap
          git -C /tmp/tap remote add origin https://github.com/abakum/homebrew-tap
          git -C /tmp/tap fetch --depth 1 origin 8c8a9386f34cc39a1e4dec3314942eb5dd19435b
          git -C /tmp/tap checkout FETCH_HEAD
          cp /tmp/tap/rustore/pepk.jar rustore/pepk.jar

      - name: Run pepk.jar
        run: |
          java -jar rustore/pepk.jar \
            --keystore=/tmp/keystore.jks \
            --alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            --keystore-pass="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --output=pepk_out.zip \
            --encryptionkey="${{ secrets.RUSTORE_ENCRYPTION_KEY }}" \
            --include-cert

      - name: Upload rustore signing artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustore-signing
          path: |
            pepk_out.zip
            rustore/upload.pem
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -f /tmp/keystore.jks
