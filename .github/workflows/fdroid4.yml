name: F-Droid Metadata (4 ABI)

on:
  workflow_dispatch:
    inputs:
      first:
        description: 'Initial registration: generate recipe from FyneApp.toml'
        required: false
        default: false
        type: boolean
      load:
        description: 'Load current recipe from fdroiddata GitLab'
        required: false
        default: false
        type: boolean
      status:
        description: 'Status only: is the FyneApp.toml version in the fdroiddata recipe, and did its build succeed/fail? (read-only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  APP_ID: com.github.abakum.crocson

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version info
        id: info
        run: |
          VERSION=$(grep -E '^\s*Version\s*=' FyneApp.toml | sed -E 's/^\s*Version\s*=\s*"([^"]+)".*/\1/')
          BUILD=$(grep -E '^\s*Build\s*=' FyneApp.toml | sed -E 's/^\s*Build\s*=\s*([0-9]+).*/\1/')
          COMMIT_SHA=$(git rev-list -n 1 "v${VERSION}" || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Build: $BUILD, Commit: $COMMIT_SHA"

      - name: Load recipe from fdroiddata
        if: github.event.inputs.load == 'true'
        id: load
        continue-on-error: true
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          curl -sf --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/fdroid%2Ffdroiddata/repository/files/metadata%2F${APP_ID}.yml/raw?ref=master" \
            -o "metadata/${APP_ID}.yml"
          echo "=== Loaded recipe ==="
          cat "metadata/${APP_ID}.yml"

      - name: Check F-Droid status
        if: github.event.inputs.status == 'true'
        run: |
          set -u
          VER="${{ steps.info.outputs.version }}"
          RECIPE_URL="https://gitlab.com/fdroid/fdroiddata/-/raw/master/metadata/${APP_ID}.yml"
          REPO="https://f-droid.org/repo"

          # HEAD probe: 200 = present, 404 = absent
          http() { curl -sI -o /dev/null -w "%{http_code}" "$1"; }

          code=$(http "$RECIPE_URL")
          if [ "$code" != "200" ]; then
            echo "::notice::Recipe not found on fdroiddata master (HTTP ${code})."
            {
              echo "### F-Droid status for v${VER}"
              echo "- New recipe: **not found** on master (HTTP ${code})"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl -sf "$RECIPE_URL" -o recipe.yml

          # Pair versionName/versionCode (versionName precedes versionCode per build block)
          mapfile -t PAIRS < <(paste -d'|' \
            <(grep -E '^\s*-\s*versionName:' recipe.yml | sed -E 's/[^:]*:\s*"?([^"]+)"?/\1/') \
            <(grep -E '^\s*versionCode:' recipe.yml | sed -E 's/[^:]*:\s*([0-9]+).*/\1/'))

          CODES=()
          for p in "${PAIRS[@]}"; do [ "${p%%|*}" = "$VER" ] && CODES+=("${p##*|}"); done

          {
            echo "### F-Droid status for v${VER}"
            if [ "${#CODES[@]}" -eq 0 ]; then
              echo "- New recipe: **NOT detected** — v${VER} is absent from the recipe on master."
              if [ "${#PAIRS[@]}" -gt 0 ]; then
                echo "  (recipe newest version: ${PAIRS[-1]%%|*})"
              fi
            else
              echo "- New recipe: **detected** — v${VER} is on master, codes: ${CODES[*]}"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

          for c in "${CODES[@]}"; do
            apk="${REPO}/${APP_ID}_${c}.apk"
            log="${REPO}/${APP_ID}_${c}.log.gz"
            if [ "$(http "$apk")" = "200" ]; then st="SUCCESS";
            elif [ "$(http "$log")" = "200" ]; then st="FAILED";
            else st="PENDING"; fi
            echo "- code ${c}: **${st}** — [apk](${apk}) · [log](${log})" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - name: Generate recipe from FyneApp.toml
        if: github.event.inputs.status != 'true' && (github.event.inputs.first == 'true' || (github.event.inputs.load == 'true' && steps.load.outcome == 'failure'))
        run: |
           bash metadata/generate_recipe.sh \
            "${{ steps.info.outputs.version }}" \
            "${{ steps.info.outputs.build }}" \
            "${{ steps.info.outputs.commit_sha }}" \
            "metadata/${APP_ID}.yml"

      - name: Verify recipe exists
        if: github.event.inputs.status != 'true' && github.event.inputs.first != 'true' && github.event.inputs.load != 'true'
        run: |
          if [ ! -f "metadata/${APP_ID}.yml" ]; then
            echo "ERROR: metadata/${APP_ID}.yml not found"
            echo "Run with first=true to generate, or load=true to download from fdroiddata."
            exit 1
          fi
          echo "Recipe found: metadata/${APP_ID}.yml"

      - name: Commit and push to GitHub
        if: github.event.inputs.status != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update F-Droid metadata for v${{ steps.info.outputs.version }}"
          git push

      - name: Create Merge Request to fdroiddata
        if: github.event.inputs.status != 'true' && github.event.inputs.load != 'true' && env.GITLAB_TOKEN != ''
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          BUILD="${{ steps.info.outputs.build }}"
          BRANCH="crocson-v${VERSION}"
          GL_TOKEN="${{ env.GITLAB_TOKEN }}"

          EXISTING_MR=$(curl -sf "https://gitlab.com/api/v4/projects/36528/merge_requests?state=opened&search=${APP_ID}" \
            -H "PRIVATE-TOKEN: ${GL_TOKEN}" \
            | grep -o "\"source_branch\":\"[^\"]*\"" \
            | head -1 \
            | sed 's/"source_branch":"//;s/"//')
          if [ -n "$EXISTING_MR" ]; then
            echo "Found open MR, reusing branch: $EXISTING_MR"
            BRANCH="$EXISTING_MR"
          fi

          curl -sf -X POST "https://gitlab.com/api/v4/projects/fdroid%2Ffdroiddata/fork" \
            -H "PRIVATE-TOKEN: ${GL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' > /dev/null || echo "Fork already exists or created"

          git clone --depth=1 "https://gitlab.com/fdroid/fdroiddata.git" /tmp/fdroiddata
          cd /tmp/fdroiddata
          git fetch --unshallow
          git remote add fork "https://oauth2:${GL_TOKEN}@gitlab.com/abakum/fdroiddata.git"

          git checkout -b "$BRANCH" || git checkout "$BRANCH"

          # Copy recipe
          cp "${{ github.workspace }}/metadata/${APP_ID}.yml" "metadata/${APP_ID}.yml"

          # Copy srclib definitions (only on initial registration)
          if [ "${{ github.event.inputs.first }}" = "true" ]; then
            mkdir -p srclibs
            cp "${{ github.workspace }}/metadata/srclibs/"*.yml "srclibs/"
          fi

          # Commit and push to fork
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "metadata/${APP_ID}.yml" srclibs/
          git diff --cached --quiet && echo "No changes to push to fdroiddata" && exit 0
          git commit -m "${APP_ID}: update to v${VERSION}"
          git push fork "$BRANCH" --force

          BODY=$(cat << JSONEOF
          {
            "source_branch": "${BRANCH}",
            "target_branch": "master",
            "target_project_id": 36528,
            "title": "${APP_ID}: update to v${VERSION}",
            "description": "Automated metadata update for ${APP_ID} v${VERSION}.\n\nGenerated by [crocson workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          }
          JSONEOF
          )

          RESPONSE=$(curl -s -X POST \
            "https://gitlab.com/api/v4/projects/abakum%2Ffdroiddata/merge_requests" \
            -H "PRIVATE-TOKEN: ${GL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "API Response: $RESPONSE"
          MR_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('web_url', d.get('message','unknown')))" 2>/dev/null || echo "PARSE_FAILED")
          echo "Merge Request: $MR_URL"
