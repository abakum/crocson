name: F-Droid Metadata (4 ABI)

on:
  workflow_dispatch:
    inputs:
      first:
        description: 'Initial registration: generate recipe from FyneApp.toml'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      load:
        description: 'Load current recipe from fdroiddata GitLab'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

env:
  APP_ID: com.github.abakum.crocson

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version info
        id: info
        run: |
          VERSION=$(grep -E '^\s*Version\s*=' FyneApp.toml | sed -E 's/^\s*Version\s*=\s*"([^"]+)".*/\1/')
          BUILD=$(grep -E '^\s*Build\s*=' FyneApp.toml | sed -E 's/^\s*Build\s*=\s*([0-9]+).*/\1/')
          COMMIT_SHA=$(git rev-list -n 1 "v${VERSION}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Build: $BUILD, Commit: $COMMIT_SHA"

      - name: Check changelog originals exist
        if: github.event.inputs.first == 'true'
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          FOUND=false
          for LOCALE_DIR in metadata/*/changelogs; do
            if [ -f "${LOCALE_DIR}/${VERSION}.txt" ]; then
              echo "Changelog found: ${LOCALE_DIR}/${VERSION}.txt"
              FOUND=true
            fi
          done
          if [ "$FOUND" = false ]; then
            echo "ERROR: No changelog originals found for ${VERSION}"
            echo "Create metadata/en-US/changelogs/${VERSION}.txt (and other locales) first."
            exit 1
          fi

      - name: Load recipe from fdroiddata
        if: github.event.inputs.load == 'true'
        id: load
        continue-on-error: true
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          curl -sf --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/fdroid%2Ffdroiddata/repository/files/metadata%2F${APP_ID}.yml/raw?ref=master" \
            -o "metadata/${APP_ID}.yml"
          echo "=== Loaded recipe ==="
          cat "metadata/${APP_ID}.yml"

      - name: Create symlinks for all ABIs and locales
        if: github.event.inputs.first == 'true' || (github.event.inputs.first != 'true' && github.event.inputs.load != 'true') || (github.event.inputs.load == 'true' && steps.load.outcome == 'failure')
        run: |
          BUILD=${{ steps.info.outputs.build }}
          VERSION=${{ steps.info.outputs.version }}
          for LOCALE_DIR in metadata/*/changelogs; do
            ORIGINAL="${LOCALE_DIR}/${VERSION}.txt"
            if [ ! -f "$ORIGINAL" ]; then
              continue
            fi
            for i in 0 1 2 3; do
              VC=$((BUILD + i))
              LINK="${LOCALE_DIR}/${VC}.txt"
              ln -sf "${VERSION}.txt" "$LINK"
              echo "Linked: ${LINK} -> ${VERSION}.txt"
            done
          done

      - name: Generate recipe from FyneApp.toml
        if: github.event.inputs.first == 'true' || (github.event.inputs.load == 'true' && steps.load.outcome == 'failure')
        run: |
          bash generate_recipe.sh \
            "${{ steps.info.outputs.version }}" \
            "${{ steps.info.outputs.build }}" \
            "${{ steps.info.outputs.commit_sha }}" \
            "metadata/${APP_ID}.yml"

      - name: Verify recipe exists
        if: github.event.inputs.first != 'true' && github.event.inputs.load != 'true'
        run: |
          if [ ! -f "metadata/${APP_ID}.yml" ]; then
            echo "ERROR: metadata/${APP_ID}.yml not found"
            echo "Run with first=true to generate, or load=true to download from fdroiddata."
            exit 1
          fi
          echo "Recipe found: metadata/${APP_ID}.yml"

      - name: Commit and push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update F-Droid metadata for v${{ steps.info.outputs.version }}"
          git push

      - name: Create Merge Request to fdroiddata
        if: github.event.inputs.load != 'true' && env.GITLAB_TOKEN != ''
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          VERSION="${{ steps.info.outputs.version }}"
          BUILD="${{ steps.info.outputs.build }}"
          BRANCH="crocson-v${VERSION}"
          GL_TOKEN="${{ env.GITLAB_TOKEN }}"

          # Ensure fork exists (idempotent — returns existing fork if already forked)
          curl -sf -X POST "https://gitlab.com/api/v4/projects/fdroid%2Ffdroiddata/fork" \
            -H "PRIVATE-TOKEN: ${GL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}' > /dev/null || echo "Fork already exists or created"

          # Clone upstream (always fresh master), add fork as push remote
          git clone --depth=1 "https://gitlab.com/fdroid/fdroiddata.git" /tmp/fdroiddata
          cd /tmp/fdroiddata
          git fetch --unshallow
          git remote add fork "https://oauth2:${GL_TOKEN}@gitlab.com/abakum/fdroiddata.git"

          # Create and checkout new branch (or reset if exists)
          git checkout -b "$BRANCH" || git checkout "$BRANCH"

          # Copy recipe
          cp "${{ github.workspace }}/metadata/${APP_ID}.yml" "metadata/${APP_ID}.yml"

          # Copy changelogs for all ABIs and locales (follow symlinks)
          for LOCALE_DIR in "${{ github.workspace }}/metadata/"*/changelogs; do
            LOCALE=$(basename "$(dirname "$LOCALE_DIR")")
            mkdir -p "metadata/${APP_ID}/${LOCALE}/changelogs"
            for i in 0 1 2 3; do
              VC=$((BUILD + i))
              SRC="${LOCALE_DIR}/${VC}.txt"
              if [ -f "$SRC" ]; then
                cp -L "$SRC" "metadata/${APP_ID}/${LOCALE}/changelogs/${VC}.txt"
              fi
            done
          done

          # Commit and push to fork
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "metadata/${APP_ID}.yml" "metadata/${APP_ID}/"
          git diff --cached --quiet && echo "No changes to push to fdroiddata" && exit 0
          git commit -m "${APP_ID}: update to v${VERSION}"
          git push fork "$BRANCH" --force

          # Create MR from fork to upstream via GitLab API
          # Skip if first=true — branch was force-pushed to existing MR
          if [ "${{ github.event.inputs.first }}" = "true" ]; then
            echo "First mode: skipping MR creation (branch force-pushed to existing MR)"
            echo "MR: https://gitlab.com/fdroid/fdroiddata/-/merge_requests?search=${APP_ID}+${VERSION}"
            exit 0
          fi

          BODY=$(cat << JSONEOF
          {
            "source_branch": "${BRANCH}",
            "target_branch": "master",
            "target_project_id": 36528,
            "title": "${APP_ID}: update to v${VERSION}",
            "description": "Automated metadata update for ${APP_ID} v${VERSION}.\n\nGenerated by [crocson workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          }
          JSONEOF
          )

          RESPONSE=$(curl -s -X POST \
            "https://gitlab.com/api/v4/projects/abakum%2Ffdroiddata/merge_requests" \
            -H "PRIVATE-TOKEN: ${GL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "API Response: $RESPONSE"
          MR_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('web_url', d.get('message','unknown')))" 2>/dev/null || echo "PARSE_FAILED")
          echo "Merge Request: $MR_URL"
