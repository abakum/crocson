name: AAB Build and Verify

on:
  workflow_dispatch:
    inputs:
      build-aab:
        description: 'Upload .aab'
        required: false
        default: true
        type: boolean
      build-apk:
        description: 'Build & upload universal .apk'
        required: false
        default: false
        type: boolean
      build-apks:
        description: 'Build & upload .apks (all ABI splits)'
        required: false
        default: false
        type: boolean
      upload-rustore:
        description: 'Upload .aab to RuStore (draft)'
        required: false
        default: false
        type: boolean
      upload-appgallery:
        description: 'Upload .aab to AppGallery (draft)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-android-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository (crocson)
        uses: actions/checkout@v4
        with:
          path: workspace/crocson

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/workspace/crocson/go.mod
          cache-dependency-path: ${{ github.workspace }}/workspace/crocson/go.sum

      - name: Checkout tools dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/tools
          ref: main
          path: workspace/tools

      - name: Install Fyne CLI
        run: |
          cd $GITHUB_WORKSPACE/workspace/tools/cmd/fyne
          go install

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup NDK r27d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Install Android SDK
        run: |
          rm -rf "$ANDROID_HOME/platforms/android-3"* "$ANDROID_HOME/build-tools/3"*
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup bundletool
        uses: amyu/setup-bundletool@v1.1
        with:
          version: 1.18.3

      - name: Decode keystore
        if: ${{ inputs.build-apk || inputs.build-apks }}
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > /tmp/keystore.jks

      - name: Decode RuStore upload keystore
        run: |
          echo "${{ secrets.RUSTORE_UPLOAD_KEYSTORE }}" | base64 -d > /tmp/rustore-upload.keystore

      - name: fyne release — build AAB
        run: |
          cd $GITHUB_WORKSPACE/workspace/crocson
          fyne release --os android \
            --keystore /tmp/rustore-upload.keystore \
            --key-name "${{ secrets.RUSTORE_KEY_ALIAS }}" \
            --keystore-pass "${{ secrets.RUSTORE_UPLOAD_KEYSTORE_PASSWORD }}"
          if [ ! -f "crocson.aab" ]; then
            echo "ERROR: crocson.aab was not created"
            ls -la .
            exit 1
          fi
          echo "AAB created:"
          ls -la crocson.aab

      - name: bundletool — universal APK
        if: ${{ inputs.build-apk }}
        run: |
          cd $GITHUB_WORKSPACE/workspace/crocson
          bundletool build-apks \
            --bundle=crocson.aab \
            --output-format=DIRECTORY \
            --output=crocson-universal \
            --mode=universal \
            --ks=/tmp/keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass="pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass="pass:${{ secrets.ANDROID_KEY_PASSWORD }}"
          mv crocson-universal/universal.apk crocson-all.apk
          rm -rf crocson-universal
          ls -la crocson-all.apk

      - name: bundletool — all ABIs APKs
        if: ${{ inputs.build-apks }}
        run: |
          cd $GITHUB_WORKSPACE/workspace/crocson

          bundletool build-apks \
            --bundle=crocson.aab \
            --output=crocson.apks \
            --ks=/tmp/keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass="pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass="pass:${{ secrets.ANDROID_KEY_PASSWORD }}"

          ls -la crocson.apks

      - name: Filter .apks — keep uncompressed .so only
        if: ${{ inputs.build-apks }}
        run: |
          cd $GITHUB_WORKSPACE/workspace/crocson
          go run ./cmd/apks -o crocson-filtered.apks crocson.apks
          mv crocson-filtered.apks crocson.apks
          echo "Filtered .apks contents:"
          unzip -l crocson.apks

      - name: Upload crocson.aab
        if: ${{ inputs.build-aab }}
        uses: actions/upload-artifact@v4
        with:
          name: crocson.aab
          path: ${{ github.workspace }}/workspace/crocson/crocson.aab
          retention-days: 7
          if-no-files-found: error

      - name: Upload crocson-all.apk
        if: ${{ inputs.build-apk }}
        uses: actions/upload-artifact@v4
        with:
          name: crocson-all.apk
          path: ${{ github.workspace }}/workspace/crocson/crocson-all.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload crocson.apks
        if: ${{ inputs.build-apks }}
        uses: actions/upload-artifact@v4
        with:
          name: crocson.apks
          path: ${{ github.workspace }}/workspace/crocson/crocson.apks
          retention-days: 7
          if-no-files-found: error

      - name: RuStore — upload AAB (draft)
        if: ${{ inputs.upload-rustore }}
        id: rustore
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_KEY_SECRET }}
        run: |
          set -euo pipefail

          AAB="$GITHUB_WORKSPACE/workspace/crocson/crocson.aab"
          FYNEAPP="$GITHUB_WORKSPACE/workspace/crocson/FyneApp.toml"

          APP_ID=$(grep -E '^\s*ID\s*=' "$FYNEAPP" | sed -E 's/^\s*ID\s*=\s*"([^"]+)".*/\1/')
          VERSION_NAME=$(grep -E '^\s*Version\s*=' "$FYNEAPP" | sed -E 's/^\s*Version\s*=\s*"([^"]+)".*/\1/')
          CHANGELOG="$GITHUB_WORKSPACE/workspace/crocson/metadata/ru-RU/changelogs/${VERSION_NAME}.txt"
          if [ -f "$CHANGELOG" ]; then
            WHATS_NEW=$(cat "$CHANGELOG")
          else
            WHATS_NEW="crocson v${VERSION_NAME}"
          fi

          echo "App: $APP_ID  Version: $VERSION_NAME"
          echo "AAB: $(ls -la "$AAB" | awk '{print $5}') bytes"

          # 1. Auth — SHA512withRSA(keyId + timestamp) per RuStore docs
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')
          SIGNATURE=$(printf '%s%s' "$RUSTORE_KEY_ID" "$TIMESTAMP" \
            | openssl dgst -sha512 -sign <(echo "$RUSTORE_PRIVATE_KEY" | base64 -d) \
            | base64 -w0)

          TOKEN=$(curl -sS -X POST https://public-api.rustore.ru/public/auth/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg kid "$RUSTORE_KEY_ID" \
                     --arg ts "$TIMESTAMP" \
                     --arg sig "$SIGNATURE" \
                     '{keyId:$kid, timestamp:$ts, signature:$sig}')" \
            | jq -r '.body.jwe')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: RuStore auth failed"
            exit 1
          fi
          echo "Auth OK"

          # 2. Create draft
          DRAFT_RESP=$(curl -sS -X POST \
            "https://public-api.rustore.ru/public/v1/application/${APP_ID}/version" \
            -H 'Content-Type: application/json' \
            -H "Public-Token: $TOKEN" \
            -d "$(jq -n --arg wn "$WHATS_NEW" '{whatsNew:$wn, publishType:"INSTANTLY"}')")

          echo "Draft response:"
          echo "$DRAFT_RESP" | jq .

          VERSION_ID=$(echo "$DRAFT_RESP" | jq -r '.body // empty')
          if [ -z "$VERSION_ID" ]; then
            VERSION_ID=$(echo "$DRAFT_RESP" | jq -r '.message' | grep -oP 'ID\s*=\s*\K\d+')
          fi
          if [ -z "$VERSION_ID" ]; then
            echo "ERROR: Could not create/find draft"
            exit 1
          fi
          echo "Draft ID: $VERSION_ID"

          # 3. Upload AAB — curl -F per official RuStore docs
          UPLOAD_RESP=$(curl -sS --location --request POST \
            "https://public-api.rustore.ru/public/v1/application/${APP_ID}/version/${VERSION_ID}/aab" \
            -H "Public-Token: $TOKEN" \
            --form "file=@${AAB}")

          echo "Upload response:"
          echo "$UPLOAD_RESP" | jq .

          CODE=$(echo "$UPLOAD_RESP" | jq -r '.code')
          if [ "$CODE" != "OK" ]; then
            echo "ERROR: AAB upload failed"
            exit 1
          fi
          echo "AAB uploaded to draft $VERSION_ID"

          # 4. Send draft to moderation
          PERM_FILE="$GITHUB_WORKSPACE/workspace/crocson/metadata/ru-RU/permissions.txt"
          COMMIT_RESP=$(curl -sS -X POST \
            "https://public-api.rustore.ru/public/v1/application/${APP_ID}/version/${VERSION_ID}/commit" \
            -H "Public-Token: $TOKEN")
          echo "Commit response:"
          echo "$COMMIT_RESP" | jq .

          COMMIT_CODE=$(echo "$COMMIT_RESP" | jq -r '.code')
          if [ "$COMMIT_CODE" != "OK" ]; then
            echo "ERROR: send-to-moderation (commit) failed"
            echo "----- permissions.txt (для ручного заполнения поля 'Чувствительные разрешения' в консоли RuStore) -----"
            [ -f "$PERM_FILE" ] && cat "$PERM_FILE" || echo "(файл $PERM_FILE не найден)"
            echo "--------------------------------------------------------------------------------------------------------"
            exit 1
          fi
          echo "Draft $VERSION_ID sent to moderation"

          # 5. Verify — GET version status
          VERIFY_RESP=$(curl -sS \
            "https://public-api.rustore.ru/public/v1/application/${APP_ID}/version?ids=${VERSION_ID}" \
            -H "Public-Token: $TOKEN")
          echo "Draft verification:"
          echo "$VERIFY_RESP" | jq '.body.content[0]'

          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT
          echo "status=sent_to_moderation" >> $GITHUB_OUTPUT

      - name: AppGallery — upload AAB (draft)
        if: ${{ inputs.upload-appgallery }}
        env:
          AGC_CLIENT_ID: ${{ secrets.APPGALLERY_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.APPGALLERY_CLIENT_SECRET }}
          AGC_APP_ID: ${{ secrets.APPGALLERY_APP_ID }}
        run: |
          set -euo pipefail

          AGC_BASE="https://connect-api.cloud.huawei.com/api"
          AAB="$GITHUB_WORKSPACE/workspace/crocson/crocson.aab"
          [ -f "$AAB" ] || { echo "ERROR: $AAB not found"; exit 1; }

          FILE_NAME=$(basename "$AAB")
          CONTENT_LENGTH=$(stat -c %s "$AAB")

          # 1. Token
          [ -n "$AGC_CLIENT_ID" ]     || { echo "ERROR: APPGALLERY_CLIENT_ID secret is empty"; exit 1; }
          [ -n "$AGC_CLIENT_SECRET" ] || { echo "ERROR: APPGALLERY_CLIENT_SECRET secret is empty"; exit 1; }
          [ -n "$AGC_APP_ID" ]        || { echo "ERROR: APPGALLERY_APP_ID secret is empty"; exit 1; }
          TOKEN_RESP=$(curl -sS -X POST "$AGC_BASE/oauth2/v1/token" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg ci "$AGC_CLIENT_ID" --arg cs "$AGC_CLIENT_SECRET" \
                 '{grant_type:"client_credentials", client_id:$ci, client_secret:$cs}')")
          TOKEN=$(echo "$TOKEN_RESP" | jq -r '.access_token // empty')
          if [ -z "$TOKEN" ]; then
            echo "ERROR: AGC auth failed. Response:"
            echo "$TOKEN_RESP" | jq .
            exit 1
          fi
          echo "AGC auth OK"

          # 2. Upload URL for OBS
          UPLOAD_INFO=$(curl -sS -X GET \
            "$AGC_BASE/publish/v2/upload-url/for-obs?appId=$AGC_APP_ID&fileName=$FILE_NAME&contentLength=$CONTENT_LENGTH" \
            -H "Authorization: Bearer $TOKEN" \
            -H "client_id: $AGC_CLIENT_ID" \
            -H "Content-Type: application/json")
          echo "Upload-info response:"
          echo "$UPLOAD_INFO" | jq .
          UPLOAD_URL=$(echo "$UPLOAD_INFO" | jq -r '.urlInfo.url')
          [ "$UPLOAD_URL" != "null" ] || { echo "ERROR: get upload-url failed"; exit 1; }

          # 3. Upload file to OBS (PUT with returned signed headers)
          HTTP_CODE=$(curl -sS -o /tmp/agc_put.out -w '%{http_code}' -X PUT "$UPLOAD_URL" \
            -H "Authorization: $(echo "$UPLOAD_INFO" | jq -r '.urlInfo.headers."Authorization"')" \
            -H "x-amz-content-sha256: $(echo "$UPLOAD_INFO" | jq -r '.urlInfo.headers."x-amz-content-sha256"')" \
            -H "x-amz-date: $(echo "$UPLOAD_INFO" | jq -r '.urlInfo.headers."x-amz-date"')" \
            -H "Host: $(echo "$UPLOAD_INFO" | jq -r '.urlInfo.headers."Host"')" \
            -H "user-agent: $(echo "$UPLOAD_INFO" | jq -r '.urlInfo.headers."user-agent"')" \
            -H "Content-Type: $(echo "$UPLOAD_INFO" | jq -r '.urlInfo.headers."Content-Type"')" \
            --data-binary @"$AAB")
          echo "OBS PUT http_code=$HTTP_CODE"
          cat /tmp/agc_put.out
          [ "$HTTP_CODE" = "200" ] || { echo "ERROR: AGC AAB upload to OBS failed"; exit 1; }

          # 4. Commit (register uploaded file as version draft)
          FILE_DEST_URL=$(echo "$UPLOAD_URL" | sed -E 's|https://[^/]+/||')
          COMMIT_RESP=$(curl -sS -X PUT \
            "$AGC_BASE/publish/v2/app-file-info?appId=$AGC_APP_ID" \
            -H "Authorization: Bearer $TOKEN" \
            -H "client_id: $AGC_CLIENT_ID" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg fn "$FILE_NAME" --arg url "$FILE_DEST_URL" \
                 '{fileType:5, files:[{fileName:$fn, fileDestUrl:$url}]}')")
          echo "Commit response:"
          echo "$COMMIT_RESP" | jq .
          RET_CODE=$(echo "$COMMIT_RESP" | jq -r '.ret.code')
          [ "$RET_CODE" = "0" ] || { echo "ERROR: AGC commit (app-file-info) failed"; exit 1; }
          echo "AAB uploaded & committed to AppGallery as draft (NOT submitted for moderation)"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/keystore.jks /tmp/rustore-upload.keystore /tmp/agc_put.out
