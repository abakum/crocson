name: AAB Build and Verify

on:
  workflow_dispatch:
    inputs:
      build-aab:
        description: 'Upload .aab'
        required: false
        default: true
        type: boolean
      build-apk:
        description: 'Build & upload universal .apk'
        required: false
        default: false
        type: boolean
      build-apks:
        description: 'Build & upload .apks (all ABI splits)'
        required: false
        default: false
        type: boolean
      arm64:
        description: 'ARM64 only (APK instead of AAB)'
        required: false
        default: false
        type: boolean
      upload-rustore:
        description: 'Upload to RuStore (draft)'
        required: false
        default: false
        type: boolean
      upload-appgallery:
        description: 'Upload to AppGallery (draft)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-android-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository (crocson)
        uses: actions/checkout@v4
        with:
          path: workspace/crocson

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/workspace/crocson/go.mod
          cache-dependency-path: ${{ github.workspace }}/workspace/crocson/go.sum

      - name: Checkout tools dependency
        uses: actions/checkout@v4
        with:
          repository: abakum/tools
          ref: main
          path: workspace/tools

      - name: Install Fyne CLI
        run: |
          cd $GITHUB_WORKSPACE/workspace/tools/cmd/fyne
          go install

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup NDK r27d
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Install Android SDK
        run: |
          rm -rf "$ANDROID_HOME/platforms/android-3"* "$ANDROID_HOME/build-tools/3"*
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup bundletool
        if: ${{ !inputs.arm64 }}
        uses: amyu/setup-bundletool@v1.1
        with:
          version: 1.18.3

      - name: Decode keystore
        if: ${{ inputs.arm64 || inputs.build-apk || inputs.build-apks }}
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > /tmp/keystore.jks

      - name: Decode RuStore upload keystore
        if: ${{ !inputs.arm64 }}
        run: |
          echo "${{ secrets.RUSTORE_UPLOAD_KEYSTORE }}" | base64 -d > /tmp/rustore-upload.keystore

      - name: fyne package — build ARM64 APK
        if: ${{ inputs.arm64 }}
        run: |
          cd $GITHUB_WORKSPACE/workspace/crocson
          
          VERSION_NAME=$(grep -E '^\s*Version\s*=' FyneApp.toml | sed -E 's/^\s*Version\s*=\s*"([^"]+)".*/\1/')
          BUILD_NUMBER=$(grep -E '^\s*Build\s*=' FyneApp.toml | sed -E 's/^\s*Build\s*=\s*([0-9]+).*/\1/')
          
          if [ -z "$VERSION_NAME" ] || [ -z "$BUILD_NUMBER" ]; then
              echo "ERROR: Could not extract Version or Build number from FyneApp.toml."
              cat FyneApp.toml
              exit 1
          fi
          
          echo "Extracted Version Name: $VERSION_NAME"
          echo "Extracted Build Number: $BUILD_NUMBER"

          VC=$((BUILD_NUMBER + 1))
          sed -i "s/^Build = .*/Build = $VC/" FyneApp.toml
          echo "arm64 APK versionCode set to $VC (Build=$BUILD_NUMBER + 1)"

          echo "Building for Android target: android/arm64"
          
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH=arm64
          
          fyne package -os android/arm64 --release
          
          if [ ! -f "crocson.apk" ]; then
            echo "ERROR: crocson.apk was not created"
            ls -la .
            exit 1
          fi
          echo "APK created:"
          ls -la crocson.apk

      - name: Sign ARM64 APK
        if: ${{ inputs.arm64 }}
        run: |
          cd $GITHUB_WORKSPACE/workspace/crocson

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          if [ ! -d "$BUILD_TOOLS" ]; then
            echo "Installing Android build tools 36.0.0..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          fi

          echo "Signing crocson.apk..."
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            crocson.apk
          
          echo "Verifying crocson.apk..."
          "$BUILD_TOOLS/apksigner" verify -v crocson.apk

      - name: fyne release — build AAB
        if: ${{ !inputs.arm64 }}
        run: |
          cd $GITHUB_WORKSPACE/workspace/crocson

          BUILD_NUMBER=$(grep -E '^\s*Build\s*=' FyneApp.toml | sed -E 's/^\s*Build\s*=\s*([0-9]+).*/\1/')
          VC=$((BUILD_NUMBER - 1))
          sed -i "s/^Build = .*/Build = $VC/" FyneApp.toml
          echo "AAB versionCode set to $VC (Build=$BUILD_NUMBER - 1)"

          fyne release --os android \
            --keystore /tmp/rustore-upload.keystore \
            --key-name "${{ secrets.RUSTORE_KEY_ALIAS }}" \
            --keystore-pass "${{ secrets.RUSTORE_UPLOAD_KEYSTORE_PASSWORD }}"
          if [ ! -f "crocson.aab" ]; then
            echo "ERROR: crocson.aab was not created"
            ls -la .
            exit 1
          fi
          echo "AAB created:"
          ls -la crocson.aab

      - name: bundletool — universal APK
        if: ${{ !inputs.arm64 && inputs.build-apk }}
        run: |
          cd $GITHUB_WORKSPACE/workspace/crocson
          bundletool build-apks \
            --bundle=crocson.aab \
            --output-format=DIRECTORY \
            --output=crocson-universal \
            --mode=universal \
            --ks=/tmp/keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass="pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass="pass:${{ secrets.ANDROID_KEY_PASSWORD }}"
          mv crocson-universal/universal.apk crocson-all.apk
          rm -rf crocson-universal
          ls -la crocson-all.apk

      - name: bundletool — all ABIs APKs
        if: ${{ !inputs.arm64 && inputs.build-apks }}
        run: |
          cd $GITHUB_WORKSPACE/workspace/crocson

          bundletool build-apks \
            --bundle=crocson.aab \
            --output=crocson.apks \
            --ks=/tmp/keystore.jks \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass="pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            --key-pass="pass:${{ secrets.ANDROID_KEY_PASSWORD }}"

          ls -la crocson.apks

      - name: Filter .apks — keep uncompressed .so only
        if: ${{ !inputs.arm64 && inputs.build-apks }}
        run: |
          cd $GITHUB_WORKSPACE/workspace/crocson
          go run ./cmd/apks -o crocson-filtered.apks crocson.apks
          mv crocson-filtered.apks crocson.apks
          echo "Filtered .apks contents:"
          unzip -l crocson.apks

      - name: Upload crocson.aab
        if: ${{ !inputs.arm64 && inputs.build-aab }}
        uses: actions/upload-artifact@v4
        with:
          name: crocson.aab
          path: ${{ github.workspace }}/workspace/crocson/crocson.aab
          retention-days: 7
          if-no-files-found: error

      - name: Upload crocson-all.apk
        if: ${{ !inputs.arm64 && inputs.build-apk }}
        uses: actions/upload-artifact@v4
        with:
          name: crocson-all.apk
          path: ${{ github.workspace }}/workspace/crocson/crocson-all.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload crocson-arm64.apk
        if: ${{ inputs.arm64 }}
        uses: actions/upload-artifact@v4
        with:
          name: crocson-arm64.apk
          path: ${{ github.workspace }}/workspace/crocson/crocson.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload crocson.apks
        if: ${{ !inputs.arm64 && inputs.build-apks }}
        uses: actions/upload-artifact@v4
        with:
          name: crocson.apks
          path: ${{ github.workspace }}/workspace/crocson/crocson.apks
          retention-days: 7
          if-no-files-found: error

      - name: RuStore — upload (draft)
        if: ${{ inputs.upload-rustore }}
        id: rustore
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_KEY_SECRET }}
        run: |
          set -euo pipefail

          # Определяем, что загружаем: APK или AAB
          if [ "${{ inputs.arm64 }}" = "true" ]; then
            FILE="$GITHUB_WORKSPACE/workspace/crocson/crocson.apk"
            FILE_TYPE="apk"
          else
            FILE="$GITHUB_WORKSPACE/workspace/crocson/crocson.aab"
            FILE_TYPE="aab"
          fi

          FYNEAPP="$GITHUB_WORKSPACE/workspace/crocson/FyneApp.toml"

          APP_ID=$(grep -E '^\s*ID\s*=' "$FYNEAPP" | sed -E 's/^\s*ID\s*=\s*"([^"]+)".*/\1/')
          VERSION_NAME=$(grep -E '^\s*Version\s*=' "$FYNEAPP" | sed -E 's/^\s*Version\s*=\s*"([^"]+)".*/\1/')
          CHANGELOG="$GITHUB_WORKSPACE/workspace/crocson/metadata/ru-RU/changelogs/${VERSION_NAME}.txt"
          if [ -f "$CHANGELOG" ]; then
            WHATS_NEW=$(cat "$CHANGELOG")
          else
            WHATS_NEW="crocson v${VERSION_NAME}"
          fi

          echo "App: $APP_ID  Version: $VERSION_NAME"
          echo "Uploading $FILE_TYPE: $(ls -la "$FILE" | awk '{print $5}') bytes"

          # 1. Auth — SHA512withRSA(keyId + timestamp) per RuStore docs
          TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')
          SIGNATURE=$(printf '%s%s' "$RUSTORE_KEY_ID" "$TIMESTAMP" \
            | openssl dgst -sha512 -sign <(echo "$RUSTORE_PRIVATE_KEY" | base64 -d) \
            | base64 -w0)

          TOKEN=$(curl -sS -X POST https://public-api.rustore.ru/public/auth/ \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg kid "$RUSTORE_KEY_ID" \
                     --arg ts "$TIMESTAMP" \
                     --arg sig "$SIGNATURE" \
                     '{keyId:$kid, timestamp:$ts, signature:$sig}')" \
            | jq -r '.body.jwe')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: RuStore auth failed"
            exit 1
          fi
          echo "Auth OK"

          # 2. Create draft
          DRAFT_RESP=$(curl -sS -X POST \
            "https://public-api.rustore.ru/public/v1/application/${APP_ID}/version" \
            -H 'Content-Type: application/json' \
            -H "Public-Token: $TOKEN" \
            -d "$(jq -n --arg wn "$WHATS_NEW" '{whatsNew:$wn, publishType:"INSTANTLY"}')")

          echo "Draft response:"
          echo "$DRAFT_RESP" | jq .

          VERSION_ID=$(echo "$DRAFT_RESP" | jq -r '.body // empty')
          if [ -z "$VERSION_ID" ]; then
            VERSION_ID=$(echo "$DRAFT_RESP" | jq -r '.message' | grep -oP 'ID\s*=\s*\K\d+')
          fi
          if [ -z "$VERSION_ID" ]; then
            echo "ERROR: Could not create/find draft"
            exit 1
          fi
          echo "Draft ID: $VERSION_ID"

          # 3. Upload file (APK or AAB)
          UPLOAD_RESP=$(curl -sS --location --request POST \
            "https://public-api.rustore.ru/public/v1/application/${APP_ID}/version/${VERSION_ID}/${FILE_TYPE}" \
            -H "Public-Token: $TOKEN" \
            --form "file=@${FILE}")

          echo "Upload response:"
          echo "$UPLOAD_RESP" | jq .

          CODE=$(echo "$UPLOAD_RESP" | jq -r '.code')
          if [ "$CODE" != "OK" ]; then
            echo "ERROR: ${FILE_TYPE} upload failed"
            exit 1
          fi
          echo "${FILE_TYPE^^} uploaded to draft $VERSION_ID"

          # 4. Send draft to moderation
          PERM_FILE="$GITHUB_WORKSPACE/workspace/crocson/metadata/ru-RU/permissions.txt"
          COMMIT_RESP=$(curl -sS -X POST \
            "https://public-api.rustore.ru/public/v1/application/${APP_ID}/version/${VERSION_ID}/commit" \
            -H "Public-Token: $TOKEN")
          echo "Commit response:"
          echo "$COMMIT_RESP" | jq .

          COMMIT_CODE=$(echo "$COMMIT_RESP" | jq -r '.code')
          if [ "$COMMIT_CODE" != "OK" ]; then
            echo "ERROR: send-to-moderation (commit) failed"
            echo "----- permissions.txt (для ручного заполнения поля 'Чувствительные разрешения' в консоли RuStore) -----"
            [ -f "$PERM_FILE" ] && cat "$PERM_FILE" || echo "(файл $PERM_FILE не найден)"
            echo "--------------------------------------------------------------------------------------------------------"
            exit 1
          fi
          echo "Draft $VERSION_ID sent to moderation"

          # 5. Verify — GET version status
          VERIFY_RESP=$(curl -sS \
            "https://public-api.rustore.ru/public/v1/application/${APP_ID}/version?ids=${VERSION_ID}" \
            -H "Public-Token: $TOKEN")
          echo "Draft verification:"
          echo "$VERIFY_RESP" | jq '.body.content[0]'

          echo "version_id=$VERSION_ID" >> $GITHUB_OUTPUT
          echo "status=sent_to_moderation" >> $GITHUB_OUTPUT

      - name: AppGallery — upload (draft)
        if: ${{ inputs.upload-appgallery }}
        uses: eatorb/huawei-appgallery-action@e77c25116505ccbaf4fdfce9f8bf51bb02f512dc  # v1.0.0
        with:
          client-id: ${{ secrets.APPGALLERY_CLIENT_ID }}
          client-secret: ${{ secrets.APPGALLERY_CLIENT_SECRET }}
          app-id: ${{ secrets.APPGALLERY_APP_ID }}
          file-path: ${{ inputs.arm64 && github.workspace }}/workspace/crocson/crocson.apk || ${{ github.workspace }}/workspace/crocson/crocson.aab
          submit: 'false'

      - name: Cleanup
        if: always()
        run: rm -f /tmp/keystore.jks /tmp/rustore-upload.keystore